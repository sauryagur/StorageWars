[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openapi-server"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic>=2.10,<3",
    "python-multipart>=0.0.20",
    "sqlmodel>=0.0.22,<1",
    "sqlalchemy>=2,<3",
    "psycopg[binary]>=3.2,<4",
    "websockets>=14,<16",
    "httpx>=0.28,<1",
    "pytest>=8,<9",
    "pytest-asyncio>=0.25,<1",
    "PyYAML>=6,<7",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
ingest = [
    "datasets>=3,<5",
    "huggingface_hub>=0.27,<2",
    "Pillow>=11,<13",
]



[tool.black]
line-length = 88
exclude = '''
(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
  )/
)
'''

[tool.isort]
profile = "black"
skip = [
    '.eggs', '.git', '.hg', '.mypy_cache', '.nox', '.pants.d', '.tox',
    '.venv', '_build', 'buck-out', 'build', 'dist', 'node_modules', 'venv',
]
skip_gitignore = true

[tool.uv]
package = false
