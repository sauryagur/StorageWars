[metadata]
name = openapi_server
version = 1.0.0
description = Mobile-first multiplayer party game: players author a product card from an image, then guess each other&#39;s prices.  Invariants enforced by this contract:  1. **Server authority.** Clients send inputs only. The server owns    phase transitions, timers, drip schedules, lock timestamps,    scoring, and vote tallies. All timestamps in responses are    server-stamped; client clocks are never trusted. 2. **Secrets stay server-side.** &#x60;priceCents&#x60;, &#x60;originalTitle&#x60;,    &#x60;originalDescription&#x60;, and the product image are never present    in any response consumed before the REVEAL phase — including    error payloads. Guesser-facing schemas have no fields that    could carry them. The image URL is issued only to the card&#39;s    author, scoped to the AUTHOR phase window. 3. **Scores are hidden until FINAL.** No running totals anywhere. 4. **Guess values are hidden until REVEAL.** Progress is counts    only, never values. 5. **All money is integer cents.** Slider range $1–$1000, i.e.    valueCents in [100, 100000]. Numeric out-of-range input is    CLAMPED and echoed; only non-numeric input is rejected (422).    At or above $20.00 the server rounds to the nearest whole    dollar; below $20.00 cents are preserved. Clamped and rounded    values are what is stored, displayed, and scored. 6. **Card lifecycle:** &#x60;ASSIGNED -&gt; SUBMITTED | SKIPPED&#x60;. Skipped    cards (timeout / disconnect) are excluded from the guess queue,    reveal carousel, vote options, and author scoring. All totals    count SUBMITTED cards only. 7. **Token-room binding.** Every authenticated endpoint under    /rooms/{roomCode} or /games requires the session token to    resolve to a seat in THAT room, else 403 WRONG_ROOM.  Realtime events (push-only WebSocket) are specified in the companion AsyncAPI document. Gameplay inputs go through REST.  Room codes (4 chars, ~1.7M possibilities) are a convenience identifier, NOT a security boundary. Join attempts are rate-limited per IP and per failed room code. 
long_description = file: README.md
keywords = OpenAPI Impulse Buy API
python_requires = >= 3.10
classifiers =
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.12

[options]
install_requires =
    fastapi>=0.115,<1
    uvicorn[standard]>=0.34,<1
    pydantic>=2.10,<3
    python-multipart>=0.0.20
    sqlmodel>=0.0.22,<1
    sqlalchemy>=2,<3
    psycopg[binary]>=3.2,<4
    websockets>=14,<16
    httpx>=0.28,<1
    pytest>=8,<9
    pytest-asyncio>=0.25,<1
    PyYAML>=6,<7
    python-dotenv>=1,<2
setup_requires = setuptools
package_dir = =src
packages = find_namespace:

[options.packages.find]
where = src
