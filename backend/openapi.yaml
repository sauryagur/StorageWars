        required: true
        schema:
          title: votesCast
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_admin_reports__reportId__patch_request"
        required: true
      responses:
        "200":
          description: Updated.
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
      security:
      - adminAuth: []
      summary: Resolve or dismiss a report
      tags:
      - Admin
components:
  parameters:
    RoomCode:
      description: "4-character room code (convenience ID, not a secret)."
      explode: false
      in: path
      name: roomCode
      required: true
      schema:
        maxLength: 4
        minLength: 4
        pattern: "^[A-Z0-9]{4}$"
        type: string
      style: simple
    CardId:
      explode: false
      in: path
      name: cardId
      required: true
      schema:
        format: uuid
        type: string
      style: simple
  responses:
    RoomNotFound:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: Room not found or TTL-expired.
    Forbidden:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: |
        Not the room creator, token not bound to this room
        (WRONG_ROOM), or action forbidden for this seat.
    PhaseError:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/inline_object"
      description: Operation not valid for the current phase.
    ValidationError:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/inline_object_1"
      description: Input validation failure.
    RateLimited:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: "Rate-limited (join enumeration, ticket minting, or input flood)."
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          explode: false
          schema:
            minimum: 1
            type: integer
          style: simple
    AdminUnauthorized:
      description: |
        Missing or invalid admin credential. Player session tokens
        are never accepted on admin endpoints; the error body is
        generic and reveals nothing about product data.
  schemas:
    Phase:
      enum:
      - LOBBY
      - AUTHOR
      - GUESS
      - REVEAL
      - VOTE
      - FINAL
      - CLOSED
      title: Phase
      type: string
    CardStatus:
      description: |
        Author-side card lifecycle. SKIPPED (author timeout or
        disconnect) cards are excluded from the queue, carousel,
        votes, and author scoring; all totals count SUBMITTED only.
      enum:
      - ASSIGNED
      - SUBMITTED
      - SKIPPED
      title: CardStatus
      type: string
    GuessStatus:
      description: |
        Guesser-side per-card lifecycle. TIMED_OUT = capped at 20s
        (auto-locked draft if touched, else zero). SKIPPED = the
        card's author was kicked or the game ended early before this
        card was playable.
      enum:
      - UNOPENED
      - IN_PROGRESS
      - LOCKED
      - TIMED_OUT
      - SKIPPED
      title: GuessStatus
      type: string
    DisplayName:
      description: Profanity-filtered on the server.
      maxLength: 24
      minLength: 2
      title: DisplayName
      type: string
    Error:
      description: |
        Error bodies are generic. They never contain product data,
        other players' guesses, or scores.
      example:
        code: ROOM_NOT_FOUND
        message: message
      properties:
        code:
          enum:
          - ROOM_NOT_FOUND
          - ROOM_FULL
          - GAME_IN_PROGRESS
          - NAME_TAKEN
          - REJOIN_EXPIRED
          - WRONG_ROOM
          - NOT_CREATOR
          - WRONG_PHASE
          - NOT_IN_QUEUE
          - NOT_NEXT_CARD
          - CARD_ACTIVE
          - ALREADY_LOCKED
          - ALREADY_OPENED
          - ALREADY_VOTED
          - LOCK_TOO_EARLY
          - SLIDER_UNTOUCHED
          - OWN_CARD_FORBIDDEN
          - VOTEKICK_IN_PROGRESS
          - KICK_TARGET_INVALID
          - VALUE_NOT_NUMERIC
          - RATE_LIMITED
          - VALIDATION_FAILED
          title: code
          type: string
        message:
          title: message
          type: string
      required:
      - code
      - message
      title: Error
    JoinRequest:
      description: New join.
      properties:
        name:
          description: Profanity-filtered on the server.
          maxLength: 24
          minLength: 2
          title: DisplayName
          type: string
      required:
      - name
      title: JoinRequest
    RejoinRequest:
      description: |
        Rejoin with an existing seat token. Resolves the seat BEFORE
        any new-join prohibition; permitted during AUTHOR, GUESS,
        REVEAL, and VOTE. `name` is optional and ignored.
      properties:
        sessionToken:
          description: The session token originally issued to this seat.
          title: sessionToken
          type: string
        name:
          description: Profanity-filtered on the server.
          maxLength: 24
          minLength: 2
          title: DisplayName
          type: string
      required:
      - sessionToken
      title: RejoinRequest
    JoinResponse:
      example:
        roomId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        roomCode: roomCode
        playerId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        sessionToken: sessionToken
        isCreator: true
        rejoined: false
        phase: LOBBY
        ttlExpiresAt: 2000-01-23T04:56:07.000+00:00
        snapshotUrl: https://openapi-generator.tech
      properties:
        roomId:
          format: uuid
          title: roomId
          type: string
        roomCode:
          pattern: "^[A-Z0-9]{4}$"
          title: roomCode
          type: string
        playerId:
          format: uuid
          title: playerId
          type: string
        sessionToken:
          description: |
            Per-seat credential for X-Session-Token. The server stores
            only its hash. Valid for rejoin within the grace period.
          title: sessionToken
          type: string
        isCreator:
          title: isCreator
          type: boolean
        rejoined:
          default: false
          title: rejoined
          type: boolean
        phase:
          $ref: "#/components/schemas/Phase"
        ttlExpiresAt:
          format: date-time
          title: ttlExpiresAt
          type: string
        snapshotUrl:
          description: Present when phase is past LOBBY; a rejoining client should
            fetch it immediately.
          format: uri
          title: snapshotUrl
          type: string
      required:
      - phase
      - playerId
      - roomCode
      - roomId
      - sessionToken
      - ttlExpiresAt
      title: JoinResponse
    RoomState:
      example:
        phase: LOBBY
        players:
        - playerId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          name: name
          isCreator: true
          connected: true
        - playerId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          name: name
          isCreator: true
          connected: true
        canStart: true
        isCreator: true
        ttlExpiresAt: 2000-01-23T04:56:07.000+00:00
      properties:
        phase:
          $ref: "#/components/schemas/Phase"
        players:
          items:
            $ref: "#/components/schemas/RoomState_players_inner"
          title: players
          type: array
          default: null
        canStart:
          description: True only for the creator with 4-8 players.
          title: canStart
          type: boolean
        isCreator:
          title: isCreator
          type: boolean
        ttlExpiresAt:
          format: date-time
          title: ttlExpiresAt
          type: string
      required:
      - canStart
      - isCreator
      - phase
      - players
      - ttlExpiresAt
      title: RoomState
    ReplayResponse:
      example:
        newRoomId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        newRoomCode: newRoomCode
        seatClaimExpiresAt: 2000-01-23T04:56:07.000+00:00
      properties:
        newRoomId:
          format: uuid
          title: newRoomId
          type: string
        newRoomCode:
          pattern: "^[A-Z0-9]{4}$"
          title: newRoomCode
          type: string
        seatClaimExpiresAt:
          description: |
            Players (including the creator) claim seats in the new
            room by POSTing to /rooms/{newRoomCode}/join with their
            EXISTING session token before this time. Unclaimed seats
            expire with the window.
          format: date-time
          title: seatClaimExpiresAt
          type: string
      required:
      - newRoomCode
      - newRoomId
      - seatClaimExpiresAt
      title: ReplayResponse
    WsTicket:
      example:
        ticket: ticket
        expiresAt: 2000-01-23T04:56:07.000+00:00
      properties:
        ticket:
          description: Single-use; opens exactly one WebSocket.
          title: ticket
          type: string
        expiresAt:
          format: date-time
          title: expiresAt
          type: string
      required:
      - expiresAt
      - ticket
      title: WsTicket
    PriceBand:
      description: |
        1 = under $15, 2 = $15–$60 (15.00 inclusive, exclusive at 60),
        3 = $60–$200, 4 = over $200. Boundary rule: a price exactly ON
        a boundary in dollars belongs to the HIGHER band. The ONLY
        price information an author ever receives. Derived
        server-side from the immutable price snapshot.
      enum:
      - 1
      - 2
      - 3
      - 4
      title: PriceBand
      type: integer
    AuthorCardView:
      description: |
        Author's secret view: image + price band ONLY. No title, no
        description, no exact price, no review data.
      example:
        cardId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        imageUrl: https://openapi-generator.tech
        priceBand: 6
        deadlineAt: 2000-01-23T04:56:07.000+00:00
        status: ASSIGNED
        constraints:
          titleMinChars: 1
          titleMaxChars: 5
          bulletMinChars: 5
          bulletMaxChars: 2
          bulletSlots: 7
          starRatingMin: 9.301444243932576
          starRatingMax: 3.616076749251911
          starRatingStep: 2.027123023002322
      properties:
        cardId:
          format: uuid
          title: cardId
          type: string
        imageUrl:
          description: Short-lived signed URL scoped to this player and the AUTHOR
            phase window.
          format: uri
          title: imageUrl
          type: string
        priceBand:
          $ref: "#/components/schemas/PriceBand"
        deadlineAt:
          format: date-time
          title: deadlineAt
          type: string
        status:
          $ref: "#/components/schemas/CardStatus"
        constraints:
          $ref: "#/components/schemas/AuthorCardView_constraints"
      required:
      - cardId
      - constraints
      - deadlineAt
      - imageUrl
      - priceBand
      - status
      title: AuthorCardView
    AuthorCardSubmission:
      description: |
        Every field is individually optional to support the partial
        submission rule. Bullets are 0–3 strings, each independently
        optional — a two-bullet submission is valid and stored as a
        two-item array.
      example:
        title: title
        bullets:
        - bullets
        - bullets
        - bullets
        starRating: 4.607339274428313
        reviewBucket: UNDER_10
        category: category
      properties:
        title:
          description: null or omitted = left blank.
          maxLength: 60
          minLength: 8
          nullable: true
          title: title
          type: string
        bullets:
          description: |
            0 to 3 bullet strings. Fewer than 3 is a valid partial
            submission. null/omitted = no bullets.
          items:
            maxLength: 80
            minLength: 15
            type: string
          maxItems: 3
          nullable: true
          title: bullets
          type: array
          default: null
        starRating:
          maximum: 5.0
          minimum: 1.0
          multipleOf: 0.5
          nullable: true
          title: starRating
          type: number
        reviewBucket:
          enum:
          - UNDER_10
          - TEN_TO_99
          - HUNDRED_TO_999
          - THOUSAND_TO_9999
          - TEN_THOUSAND_PLUS
          - null
          nullable: true
          title: reviewBucket
          type: string
        category:
          description: Slug from the ~12-category dropdown.
          nullable: true
          title: category
          type: string
      title: AuthorCardSubmission
    AuthorCardStored:
      allOf:
      - $ref: "#/components/schemas/AuthorCardSubmission"
      - properties:
          cardId:
            format: uuid
            type: string
          status:
            $ref: "#/components/schemas/CardStatus"
          submittedAt:
            format: date-time
            nullable: true
            type: string
        required:
        - cardId
        - status
      example:
        title: title
        bullets:
        - bullets
        - bullets
        - bullets
        starRating: 1.3203312761844046
        reviewBucket: UNDER_10
        category: category
        cardId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        status: ASSIGNED
        submittedAt: 2000-01-23T04:56:07.000+00:00
      title: AuthorCardStored
    AuthorValidationError:
      allOf:
      - $ref: "#/components/schemas/Error"
      - properties:
          fieldErrors:
            items:
              $ref: "#/components/schemas/AuthorValidationError_allOf_fieldErrors"
            type: array
            default: null
        required:
        - fieldErrors
      example:
        code: ROOM_NOT_FOUND
        message: message
        fieldErrors:
        - field: field
          rule: TOO_SHORT
          message: message
        - field: field
          rule: TOO_SHORT
          message: message
      title: AuthorValidationError
    GuessQueue:
      example:
        cards:
        - cardId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          status: UNOPENED
        - cardId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          status: UNOPENED
        myPosition:
          activeCardId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          nextCardId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          allDone: true
        progress:
          myLocked: 1
          myTimedOut: 1
          myTotal: 6
          allPlayersDone: true
      properties:
        cards:
          description: |
            Shuffled per THIS player. SUBMITTED cards only — skipped
            cards are absent and not counted. Content access is still
            gated by the open endpoint's state machine regardless of
            which IDs a client holds.
          items:
            $ref: "#/components/schemas/GuessQueue_cards_inner"
          title: cards
          type: array
          default: null
        myPosition:
          $ref: "#/components/schemas/GuessQueue_myPosition"
        progress:
          $ref: "#/components/schemas/GuessQueue_progress"
      required:
      - cards
      - myPosition
      - progress
      title: GuessQueue
    GuessCardView:
      description: |
        Drip-redacted card, valid for both the open response and
        read-only GETs. ABSENT field = drip stage not reached;
        `null` = stage reached but the author left the field blank.
        This schema structurally cannot carry the image, original
        title, original description, or true price — those fields do
        not exist here.
      example:
        cardId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        status: null
        openedAt: 2000-01-23T04:56:07.000+00:00
        capAt: 2000-01-23T04:56:07.000+00:00
        lockEligibleAt: 2000-01-23T04:56:07.000+00:00
        title: title
        category: category
        bullets:
        - bullets
        - bullets
        - bullets
        starRating: 7.457744773683766
        reviewBucket: UNDER_10
        multiplierNow: 0.7351922275286783
        draftValueCents: 4
        sliderTouched: true
        locked: true
        lockedValueCents: 5
      properties:
        cardId:
          format: uuid
          title: cardId
          type: string
        status:
          $ref: "#/components/schemas/GuessStatus"
        openedAt:
          format: date-time
          title: openedAt
          type: string
        capAt:
          description: openedAt + 20s hard cap; auto-lock fires then.
          format: date-time
          title: capAt
          type: string
        lockEligibleAt:
          description: openedAt + 3s minimum dwell.
          format: date-time
          title: lockEligibleAt
          type: string
        title:
          nullable: true
          title: title
          type: string
        category:
          nullable: true
          title: category
          type: string
        bullets:
          items:
            nullable: true
            type: string
          maxItems: 3
          title: bullets
          type: array
          default: null
        starRating:
          nullable: true
          title: starRating
          type: number
        reviewBucket:
          enum:
          - UNDER_10
          - TEN_TO_99
          - HUNDRED_TO_999
          - THOUSAND_TO_9999
          - TEN_THOUSAND_PLUS
          - null
          nullable: true
          title: reviewBucket
          type: string
        multiplierNow:
          description: Live M(t) for the countdown ring.
          maximum: 1.0
          minimum: 0.7
          title: multiplierNow
          type: number
        draftValueCents:
          description: |
            The server-known draft (last accepted PUT /draft value),
            or null if never drafted. This is what auto-locks at cap
            if the slider was touched.
          nullable: true
          title: draftValueCents
          type: integer
        sliderTouched:
          title: sliderTouched
          type: boolean
        locked:
          title: locked
          type: boolean
        lockedValueCents:
          description: Present only when locked=true.
          nullable: true
          title: lockedValueCents
          type: integer
      required:
      - capAt
      - cardId
      - draftValueCents
      - lockEligibleAt
      - multiplierNow
      - openedAt
      - sliderTouched
      - status
      title: GuessCardView
    ValueInput:
      example:
        valueCents: 0
      properties:
        valueCents:
          description: |
            Numeric input. Out-of-range values are CLAMPED to
            [100, 100000]; at/above $20.00 rounded to whole dollars.
            Only non-numeric input is rejected.
          title: valueCents
          type: integer
      required:
      - valueCents
      title: ValueInput
    ValueEcho:
      example:
        valueCents: 0
        formattedValue: formattedValue
        wasClamped: true
        wasRounded: true
      properties:
        valueCents:
          title: valueCents
          type: integer
        formattedValue:
          description: e.g. "$12.34" or "$127" (rounded form above $20).
          title: formattedValue
          type: string
        wasClamped:
          title: wasClamped
          type: boolean
        wasRounded:
          title: wasRounded
          type: boolean
      required:
      - formattedValue
      - valueCents
      - wasClamped
      - wasRounded
      title: ValueEcho
    LockResponse:
      allOf:
      - $ref: "#/components/schemas/ValueEcho"
      - description: |
          No points field — points exist only on the server until
