              titleMaxChars: 5
              bulletMinChars: 5
              bulletMaxChars: 2
              bulletSlots: 7
              starRatingMin: 9.301444243932576
              starRatingMax: 3.616076749251911
              starRatingStep: 2.027123023002322
          submitted: true
          progress:
            submitted: 4
            skipped: 7
            total: 1
        guess:
