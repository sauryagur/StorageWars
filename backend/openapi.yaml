            format: uuid
            type: string
          lockedAt:
            format: date-time
            type: string
          cardSeconds:
            maximum: 20
            minimum: 0
            type: number
          multiplier:
            maximum: 1.0
            minimum: 0.7
            type: number
          nextCardId:
            description: Null when the queue is done.
            format: uuid
            nullable: true
            type: string
        required:
        - cardId
        - cardSeconds
        - lockedAt
        - multiplier
      example:
        valueCents: 0
        formattedValue: formattedValue
        wasClamped: true
        wasRounded: true
        cardId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        lockedAt: 2000-01-23T04:56:07.000+00:00
        cardSeconds: 12.054912366140806
        multiplier: 0.7439743894150883
        nextCardId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
      title: LockResponse
    GameSnapshot:
