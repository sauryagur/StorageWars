        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_admin_categories__slug__patch_request"
        required: true
      responses:
        "200":
          description: Updated.
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
      security:
      - adminAuth: []
      summary: Tune a category (sigma)
      tags:
      - Admin
  /admin/reports:
    get:
      parameters:
      - explode: true
        in: query
        name: status
        required: false
        schema:
          enum:
          - OPEN
          - RESOLVED
          - DISMISSED
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/ReportAdmin"
                type: array
