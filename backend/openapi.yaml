          description: Reports.
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
      security:
      - adminAuth: []
      summary: List reports for review
      tags:
      - Admin
  /admin/reports/{reportId}:
    patch:
      parameters:
      - explode: false
        in: path
