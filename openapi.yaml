openapi: 3.1.0
info:
  title: Impulse Buy API
  version: 2.0.0
  summary: Server-authoritative party game API for Impulse Buy
  description: |
    Mobile-first multiplayer party game: players author a product card
    from an image, then guess each other's prices.

    Invariants enforced by this contract:

    1. **Server authority.** Clients send inputs only. The server owns
       phase transitions, timers, drip schedules, lock timestamps,
       scoring, and vote tallies. All timestamps in responses are
       server-stamped; client clocks are never trusted.
    2. **Secrets stay server-side.** `priceCents`, `originalTitle`,
       `originalDescription`, and the product image are never present
       in any response consumed before the REVEAL phase — including
       error payloads. Guesser-facing schemas have no fields that
       could carry them. The image URL is issued only to the card's
       author, scoped to the AUTHOR phase window.
    3. **Scores are hidden until FINAL.** No running totals anywhere.
    4. **Guess values are hidden until REVEAL.** Progress is counts
       only, never values.
    5. **All money is integer cents.** Slider range $1–$1000, i.e.
       valueCents in [100, 100000]. Numeric out-of-range input is
       CLAMPED and echoed; only non-numeric input is rejected (422).
       At or above $20.00 the server rounds to the nearest whole
       dollar; below $20.00 cents are preserved. Clamped and rounded
       values are what is stored, displayed, and scored.
    6. **Card lifecycle:** `ASSIGNED -> SUBMITTED | SKIPPED`. Skipped
       cards (timeout / disconnect) are excluded from the guess queue,
       reveal carousel, vote options, and author scoring. All totals
       count SUBMITTED cards only.
    7. **Token-room binding.** Every authenticated endpoint under
       /rooms/{roomCode} or /games requires the session token to
       resolve to a seat in THAT room, else 403 WRONG_ROOM.

    Realtime events (push-only WebSocket) are specified in the
    companion AsyncAPI document. Gameplay inputs go through REST.

    Room codes (4 chars, ~1.7M possibilities) are a convenience
    identifier, NOT a security boundary. Join attempts are
    rate-limited per IP and per failed room code.

  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary

servers:
  - url: https://api.impulsebuy.example/v1
    description: Production

security:
  - sessionToken: []

tags:
  - name: Rooms
  - name: Session
  - name: Author
  - name: Guess
  - name: Reveal
  - name: Vote & Final
  - name: Moderation
  - name: Admin
  - name: System

paths:
  /health:
    get:
      tags: [System]
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }

  # ---------------------------------------------------------------- Rooms

  /rooms:
    post:
      tags: [Rooms]
      summary: Create a room and join as creator
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { $ref: "#/components/schemas/DisplayName" }
      responses:
        "201":
          description: Room created; caller joined as creator.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JoinResponse" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /rooms/{roomCode}/join:
    post:
      tags: [Rooms]
      summary: Join a room, or rejoin an existing seat
      description: |
        Two distinct operations, discriminated by the request body:

        * **New join:** requires `name`. Creates a new seat and a new
          session token. Returns 409 if the game is in progress, the
          room is full, or the name is taken.
        * **Rejoin:** requires `sessionToken` (an existing token from
          this room). Resolves the existing seat BEFORE any new-join
          prohibition applies — so rejoining during AUTHOR or GUESS is
          explicitly permitted. `name` is optional and ignored.
          Returns the same session token, plus the current phase so
          the client can fetch a snapshot. Rejoin is permitted in
          LOBBY, AUTHOR, GUESS, REVEAL, and VOTE; in FINAL the token
          resolves but the room is read-only.

        A failed room code is throttled per IP (429) to blunt
        enumeration of the 4-character code space.
      security: []
      parameters:
        - $ref: "#/components/parameters/RoomCode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/JoinRequest"
                - $ref: "#/components/schemas/RejoinRequest"
      responses:
        "200":
          description: Joined or rejoined.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JoinResponse" }
        "404": { $ref: "#/components/responses/RoomNotFound" }
        "409":
          description: |
            New join blocked: game in progress, room full (8), or name
            taken. Rejoin requests never receive GAME_IN_PROGRESS.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410":
          description: Rejoin token expired or seat reclaimed (grace
            period elapsed, or the room closed).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /rooms/{roomCode}:
    get:
      tags: [Rooms]
      summary: Room / lobby state
      description: |
        Current phase and player list. The session token must belong
        to a seat in this room. Never contains game secrets or scores.
      parameters:
        - $ref: "#/components/parameters/RoomCode"
      responses:
        "200":
          description: Room state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomState" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/RoomNotFound" }

  /rooms/{roomCode}/start:
    post:
      tags: [Rooms]
      summary: Start the game (creator only)
      description: |
        Samples N distinct products — log-uniform by price, sampled
        WITHOUT replacement within the game, one per player — and moves
        the room to AUTHOR with a 60-second server timer. The
        (room, product) uniqueness invariant is enforced server-side.
      parameters:
        - $ref: "#/components/parameters/RoomCode"
      responses:
        "202":
          description: Game started; room in AUTHOR.
          content:
            application/json:
              schema:
                type: object
                required: [phase, authorDeadlineAt]
                properties:
                  phase: { $ref: "#/components/schemas/Phase" }
                  authorDeadlineAt: { type: string, format: date-time }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Fewer than 4 players, or game in progress.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /rooms/{roomCode}/replay:
    post:
      tags: [Vote & Final]
      summary: Create a replay room (creator only, FINAL phase only)
      description: |
        REPLAY SEMANTICS (single model): replay always creates a NEW
        room linked to the old one via replayOfRoomId. The old room,
        its records, and its scores are immutable history. The creator
        receives the new room code and a seat-claim window. Every
        player (including the creator) claims a seat in the new room
        by calling join with their EXISTING session token inside the
        window; the server maps old token to new seat, so no new
        credentials are issued and no player ever receives another
        player's token. Unclaimed seats expire with the window.
      parameters:
        - $ref: "#/components/parameters/RoomCode"
      responses:
        "201":
          description: New room created; seat claim window opened.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReplayResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Not in FINAL phase.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # --------------------------------------------------------------- Session

  /ws/ticket:
    post:
      tags: [Session]
      summary: Mint a single-use WebSocket ticket
      description: |
        Exchanges the long-lived session token (header) for a
        short-lived, single-use connection ticket for the AsyncAPI
        WebSocket. The session token itself never appears in a URL or
        query string. Tickets expire in 60 seconds and open exactly
        one connection.
      responses:
        "201":
          description: Ticket minted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WsTicket" }
        "429":
          description: Ticket minting rate-limited (per session).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /games/current/snapshot:
    get:
      tags: [Session]
      summary: Authoritative per-player state snapshot
      description: |
        THE recovery contract for reconnects and mid-game rejoins.
        Returns the absolute, per-phase, per-player redacted state:
        phase and deadlines, queue position and per-card statuses,
        the active card with its drip-redacted fields, the server-side
        draft value, lock states, current reveal slide index, and vote
        options. Redaction rules are identical to the per-resource
        GET endpoints. The client refetches this after any reconnect
        where it may have missed events; the WebSocket stream is a
        live view, this is the truth.
      responses:
        "200":
          description: Snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameSnapshot" }
        "409": { $ref: "#/components/responses/PhaseError" }

  # --------------------------------------------------------------- Author

  /games/current/author-card:
    get:
      tags: [Author]
      summary: Get my card to author
      description: |
        Returns ONLY the product image and the coarse price band —
        never title, description, exact price, or review data. The
        image URL is signed and scoped to this player and the AUTHOR
        phase window.
      responses:
        "200":
          description: Author card view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthorCardView" }
        "409": { $ref: "#/components/responses/PhaseError" }
    put:
      tags: [Author]
      summary: Submit my authored card (full or partial)
      description: |
        Server-side validation: length rules, digit / number-word /
        currency-symbol / price-word rejection, profanity filter.
        Fields are individually optional to support the PRD's partial
        submission rule: filled fields are stored, the rest remain
        blank (null). An author who submits nothing before the 60s
        timeout is marked SKIPPED — that card is excluded from the
        queue, carousel, and votes, and scores no author points.
        Repeated PUTs before the deadline overwrite the stored card
        (last write wins); after the deadline the card is final.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthorCardSubmission" }
      responses:
        "200":
          description: Card stored (fully or partially).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthorCardStored" }
        "409": { $ref: "#/components/responses/PhaseError" }
        "422":
          description: |
            Validation failure. `fieldErrors` is field-level for live
            inline display; each entry names the rule and, for
            word-list rules, the offending word.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthorValidationError" }

  # ---------------------------------------------------------------- Guess

  /games/current/guess/queue:
    get:
      tags: [Guess]
      summary: My shuffled card queue
      description: |
        Card order is shuffled PER PLAYER, so card positions reveal
        nothing on voice chat. Only SUBMITTED cards appear; skipped
        cards are excluded and not counted in totals. Exposes card IDs
        and statuses only — content access is governed by the
        server-side one-active-card state machine on the open
        endpoint, regardless of what IDs a client holds.
      responses:
        "200":
          description: Queue stubs plus progress counts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuessQueue" }
        "409": { $ref: "#/components/responses/PhaseError" }

  /games/current/guess/cards/{cardId}/open:
    post:
      tags: [Guess]
      summary: Open the next card (starts its drip schedule)
      description: |
        THE queue state machine, server-enforced:

        * Exactly ONE active card per player at any time.
        * Only the player's NEXT eligible card may be opened. Opening
          a future card, a locked card, an already-open card, or a
          card not in this player's queue is rejected (409/404).
        * Opening a card starts its drip timers ONCE; retries can
          never reset or extend them.
        * A locked card cannot be reopened or modified.
        * The server, not the client, determines queue position and
          whether a lock advances it.

        This is a POST because it changes state; the GET on the card
        is read-only and always returns the current representation.
      parameters:
        - $ref: "#/components/parameters/CardId"
      responses:
        "200":
          description: Card opened; returns the 0s-drip representation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuessCardView" }
        "404":
          description: Card not in this player's queue.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: |
            Not the next eligible card, another card is active, the
            card is locked, or wrong phase. The error carries the
            client's authoritative queue position so it can recover.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Open attempts rate-limited (anti-fuzzing).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /games/current/guess/cards/{cardId}:
    get:
      tags: [Guess]
      summary: Read my active card (drip-redacted, read-only)
      description: |
        Read-only. NEVER starts or resets timers — only `open` does.
        The card's information is determined by the server clock
        relative to the server-recorded `openedAt`:

        * 0s — title, category
        * 5s — bullet slots
        * 10s — star rating, review-count bucket
        * 20s — hard cap; latest draft value auto-locks

        ABSENT field = drip stage not reached. `null` = the stage is
        reached but the author left the field blank. Distinct
        meanings, never conflated. This schema structurally cannot
        carry the image, original title, original description, or
        price.
      parameters:
        - $ref: "#/components/parameters/CardId"
      responses:
        "200":
          description: Drip-redacted card view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuessCardView" }
        "404":
          description: Card not in this player's queue.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409": { $ref: "#/components/responses/PhaseError" }

  /games/current/guess/cards/{cardId}/draft:
    put:
      tags: [Guess]
      summary: Update the server-side draft value (the slider position)
      description: |
        Keeps the latest slider position in authoritative server
        state. THIS is what makes the disconnect auto-lock rule
        implementable: a player who drafts $127.50, touches the
        slider, and then loses their connection has their draft
        auto-locked at the card's 20s cap. A player who never touched
        the slider scores zero. Drafts are throttled server-side
        (coalesced; only the latest value matters) and are NOT
        persisted per-keystroke — the latest value is authoritative
        and persisted at lock time or cap time. Numeric values are
        clamped to [100, 100000] cents and rounded per the money
        rule; the normalized value is echoed.
      parameters:
        - $ref: "#/components/parameters/CardId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ValueInput" }
      responses:
        "200":
          description: Draft accepted (and normalized).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValueEcho" }
        "404":
          description: Card not in this player's queue.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Card is not the active card, already locked, or
            wrong phase.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Non-numeric / unparseable value.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /games/current/guess/cards/{cardId}/touch:
    post:
      tags: [Guess]
      summary: Report slider touched (enables Lock)
      description: |
        Idempotent. Lock is disabled until the slider has been
        touched AND 3 seconds of minimum dwell have elapsed since
        open. Touch state also governs disconnect auto-lock
        (auto-lock fires only if touched).
      parameters:
        - $ref: "#/components/parameters/CardId"
      responses:
        "204": { description: Touch recorded (idempotent). }
        "409": { $ref: "#/components/responses/PhaseError" }

  /games/current/guess/cards/{cardId}/lock:
    post:
      tags: [Guess]
      summary: Lock my guess (permanent)
      description: |
        Commits the guess permanently and advances the queue. The
        lock timestamp is stamped by the SERVER. The live multiplier
        is M(t) = 1.0 - 0.3 * (t / 20), t = server-measured seconds on
        the card, clamped to [0, 20]. Points are computed server-side
        but NEVER returned before FINAL.

        Value handling: numeric input is clamped to [100, 100000]
        cents and rounded per the money rule ($20+ -> whole dollars);
        the normalized value is echoed with `wasClamped`/`wasRounded`
        flags so typos are visible. Non-numeric input is rejected
        (422). Locking without a prior draft/touch is rejected (403
        SLIDER_UNTOUCHED).
      parameters:
        - $ref: "#/components/parameters/CardId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ValueInput" }
      responses:
        "200":
          description: Lock confirmed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LockResponse" }
        "403":
          description: |
            Minimum dwell (3s) not met, slider untouched, or card
            already locked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Card not in this player's queue.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409": { $ref: "#/components/responses/PhaseError" }
        "422":
          description: Non-numeric value.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # --------------------------------------------------------------- Reveal

  /games/current/reveal:
    get:
      tags: [Reveal]
      summary: Current reveal slide
      description: |
        Shared carousel over the SUBMITTED cards, shuffled order,
        ~12s per slide, auto-advancing; the creator can advance
        early. This is the only pre-FINAL context in which product
        secrets (image, original title/description, true price) are
        released. Slides carry NO points — scores appear only on the
        final scoreboard (this resolves the PRD's internal
        contradiction in favor of hidden scores).
      responses:
        "200":
          description: Current slide.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevealSlide" }
        "409": { $ref: "#/components/responses/PhaseError" }

  /games/current/reveal/advance:
    post:
      tags: [Reveal]
      summary: Advance the carousel early (creator only)
      responses:
        "202": { description: Advanced. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/PhaseError" }

  # ---------------------------------------------------------- Vote & Final

  /games/current/vote/options:
    get:
      tags: [Vote & Final]
      summary: Cards eligible for my funniest-card vote
      description: |
        The canonical vote-phase representation: the SUBMITTED cards
        excluding the voter's own, with the minimal presentation
        needed to choose one. A rejoining client that missed slides
        recovers its options from here (and from the snapshot).
        Individual votes and tallies remain hidden until FINAL.
        Voting ends when all eligible players have voted OR the vote
        deadline (server-set, ~30s, tunable) expires; non-voters
        simply record no vote and cost no one anything.
      responses:
        "200":
          description: Vote options.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoteOptions" }
        "409": { $ref: "#/components/responses/PhaseError" }

  /games/current/vote:
    post:
      tags: [Vote & Final]
      summary: Cast funniest-card vote (one, final)
      description: |
        One hidden vote per player, for a card that is not the
        voter's own. The vote is FINAL when cast — it cannot be
        replaced or withdrawn (409 ALREADY_VOTED). Most votes wins
        +300 for the author, split on ties. Votes cast for a card
        whose author is later kicked are discarded; the kicked
        player's own vote is also discarded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cardId]
              properties:
                cardId: { type: string, format: uuid }
      responses:
        "202": { description: Vote recorded. }
        "403":
          description: Cannot vote for own card.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Already voted, or wrong phase.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /games/current/final:
    get:
      tags: [Vote & Final]
      # NOTE: summary/description continue below
      summary: Final scoreboard
      description: |
        Ranked scoreboard with full breakdown. Also the result for
        EARLY-ENDED games: `endedReason` is TOO_FEW_PLAYERS when a
        votekick dropped the room under 4 players, and the response
        includes only the cards completed by that point — the client
        never has to infer how an interrupted phase resolves.
        Author points use the mean accuracy over ALL eligible
        guessers on the card (kicked players excluded; zero-accuracy
        and timed-out guesses count as 0 in the denominator — never
        a mean over locked guesses only).
      responses:
        "200":
          description: Final scoreboard.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinalScoreboard" }
        "409": { $ref: "#/components/responses/PhaseError" }

  # ------------------------------------------------------------- Moderation

  /reports:
    post:
      tags: [Moderation]
      summary: Report a card or a player
      description: |
        For offensive content or AFK only. Exactly one of
        reportedCardId / reportedPlayerId must be present, and the
        target must belong to the reporter's room. Reports never
        carry game secrets to moderators before the reveal.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportRequest" }
      responses:
        "202": { description: Report recorded. }
        "422": { $ref: "#/components/responses/ValidationError" }

  /rooms/{roomCode}/votekick:
    post:
      tags: [Moderation]
      summary: Cast a votekick vote (idempotent)
      description: |
        Reasons are offensive content or AFK only — NOT cheating
        accusations (per PRD). Semantics:

        * Exactly one ACTIVE votekick per room; the active vote must
          resolve or expire before a different target can be raised
          (409 VOTEKICK_IN_PROGRESS).
        * One vote per player per votekick. Duplicate calls are
          idempotent: they return the current tally and emit no event.
        * Threshold: ceil(2/3 of OTHER players), evaluated on each
          new vote; the kick executes when reached.
        * The votekick expires after 30s without reaching threshold.
        * A kicked player's card and guesses are removed from
          everyone's totals; their vote is discarded, and votes cast
          for their card are discarded. Scoring is prior-based, so
          removal requires no crowd recomputation.
        * If fewer than 4 players remain, the game ends early:
          phase moves to FINAL with endedReason TOO_FEW_PLAYERS and
          the completed cards.
        * If the target disconnects before resolution, the votekick
          is CANCELLED (no kick; disconnect rules apply instead).
      parameters:
        - $ref: "#/components/parameters/RoomCode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetPlayerId, reason]
              properties:
                targetPlayerId: { type: string, format: uuid }
                reason:
                  type: string
                  enum: [OFFENSIVE_CONTENT, AFK]
      responses:
        "200":
          description: |
            Vote recorded or duplicate (idempotent). Returns the
            current tally.
          content:
            application/json:
              schema:
                type: object
                required: [votesCast, requiredVotes, resolved]
                properties:
                  votesCast: { type: integer }
                  requiredVotes: { type: integer }
                  resolved:
                    type: boolean
                    description: True when the kick executed.
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: |
            Another votekick is active for a different target, or
            wrong phase.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ---------------------------------------------------------------- Admin
  # SECURITY: every /admin operation overrides the global scheme with
  # the admin bearer scheme. A player session token can never satisfy
  # it. Product secrets appear ONLY in these responses.

  /admin/products:
    get:
      tags: [Admin]
      summary: List products (full secrets)
      security:
        - adminAuth: []
      parameters:
        - name: active
          in: query
          schema: { type: boolean }
        - name: category
          in: query
          schema: { type: string }
        - name: priceBand
          in: query
          schema: { type: integer, minimum: 1, maximum: 4 }
      responses:
        "200":
          description: Products.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProductAdmin" }
        "401": { $ref: "#/components/responses/AdminUnauthorized" }
    post:
      tags: [Admin]
      summary: Create a product
      security:
        - adminAuth: []
      description: |
        Product images are imported and registered OUT OF BAND (the
        ingestion pipeline re-encodes, strips metadata and filenames,
        and writes the ProductImage row). This endpoint references an
        already-registered image by `imageStorageKey`, whose format is
        `products/{contentHash}.{webp|jpg}`. An unknown storage key is
        rejected. `snapshotDate` is a calendar date (date, not
        datetime) and matches the reveal copy ("snapshot price as
        of …"). `priceBand` is derived server-side from priceCents
        and is immutable — product price snapshots are immutable
        after curation; corrections create a new product version.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductAdmin" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductAdmin" }
        "401": { $ref: "#/components/responses/AdminUnauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/categories/{slug}:
    patch:
      tags: [Admin]
      summary: Tune a category (sigma)
      security:
        - adminAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sigma:
                  type: number
                  minimum: 0.05
                  maximum: 3.0
                  description: Prior spread for scoring normalization.
                active: { type: boolean }
      responses:
        "200": { description: Updated. }
        "401": { $ref: "#/components/responses/AdminUnauthorized" }

  /admin/reports:
    get:
      tags: [Admin]
      summary: List reports for review
      security:
        - adminAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [OPEN, RESOLVED, DISMISSED]
      responses:
        "200":
          description: Reports.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ReportAdmin" }
        "401": { $ref: "#/components/responses/AdminUnauthorized" }

  /admin/reports/{reportId}:
    patch:
      tags: [Admin]
      summary: Resolve or dismiss a report
      security:
        - adminAuth: []
      parameters:
        - name: reportId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [RESOLVED, DISMISSED]
                resolutionNote: { type: string, maxLength: 1000 }
      responses:
        "200": { description: Updated. }
        "401": { $ref: "#/components/responses/AdminUnauthorized" }

components:
  securitySchemes:
    sessionToken:
      type: apiKey
      in: header
      name: X-Session-Token
      description: |
        Long-lived per-seat credential issued by create/join.
        Authorizes exactly one player seat in exactly one room;
        presenting it against any other room returns 403 WRONG_ROOM.
        Never appears in URLs or query strings.
    adminAuth:
      type: http
      scheme: bearer
      description: |
        Separate administrative credential. Every /admin operation
        explicitly requires THIS scheme (overriding the global player
        scheme); a player session token must never satisfy it. A
        player token presented as an admin bearer token fails 401.

  parameters:
    RoomCode:
      name: roomCode
      in: path
      required: true
      schema:
        type: string
        minLength: 4
        maxLength: 4
        pattern: "^[A-Z0-9]{4}$"
      description: 4-character room code (convenience ID, not a secret).
    CardId:
      name: cardId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    RoomNotFound:
      description: Room not found or TTL-expired.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: |
        Not the room creator, token not bound to this room
        (WRONG_ROOM), or action forbidden for this seat.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PhaseError:
      description: Operation not valid for the current phase.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  phase: { $ref: "#/components/schemas/Phase" }
                  retryInPhase:
                    type: [string, "null"]
                    description: The phase in which this operation
                      becomes valid, if any.
    ValidationError:
      description: Input validation failure.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  fieldErrors:
                    type: array
                    items:
                      type: object
                      required: [field, rule]
                      properties:
                        field: { type: string }
                        rule:
                          type: string
                          enum:
                            - TOO_SHORT
                            - TOO_LONG
                            - DIGITS_REJECTED
                            - NUMBER_WORD_REJECTED
                            - CURRENCY_SYMBOL_REJECTED
                            - PRICE_WORD_REJECTED
                            - PROFANITY_REJECTED
                            - BULLET_COUNT
                            - STAR_RATING_STEP
                            - CATEGORY_UNKNOWN
                            - OUT_OF_RANGE
                            - EXACTLY_ONE_TARGET
                            - IMAGE_KEY_UNKNOWN
    RateLimited:
      description: Rate-limited (join enumeration, ticket minting,
        or input flood).
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AdminUnauthorized:
      description: |
        Missing or invalid admin credential. Player session tokens
        are never accepted on admin endpoints; the error body is
        generic and reveals nothing about product data.

  schemas:
    Phase:
      type: string
      enum: [LOBBY, AUTHOR, GUESS, REVEAL, VOTE, FINAL, CLOSED]

    CardStatus:
      type: string
      enum: [ASSIGNED, SUBMITTED, SKIPPED]
      description: |
        Author-side card lifecycle. SKIPPED (author timeout or
        disconnect) cards are excluded from the queue, carousel,
        votes, and author scoring; all totals count SUBMITTED only.

    GuessStatus:
      type: string
      enum: [UNOPENED, IN_PROGRESS, LOCKED, TIMED_OUT, SKIPPED]
      description: |
        Guesser-side per-card lifecycle. TIMED_OUT = capped at 20s
        (auto-locked draft if touched, else zero). SKIPPED = the
        card's author was kicked or the game ended early before this
        card was playable.

    DisplayName:
      type: string
      minLength: 2
      maxLength: 24
      description: Profanity-filtered on the server.

    Error:
      type: object
      required: [code, message]
      description: |
        Error bodies are generic. They never contain product data,
        other players' guesses, or scores.
      properties:
        code:
          type: string
          enum:
            - ROOM_NOT_FOUND
            - ROOM_FULL
            - GAME_IN_PROGRESS
            - NAME_TAKEN
            - REJOIN_EXPIRED
            - WRONG_ROOM
            - NOT_CREATOR
            - WRONG_PHASE
            - NOT_IN_QUEUE
            - NOT_NEXT_CARD
            - CARD_ACTIVE
            - ALREADY_LOCKED
            - ALREADY_OPENED
            - ALREADY_VOTED
            - LOCK_TOO_EARLY
            - SLIDER_UNTOUCHED
            - OWN_CARD_FORBIDDEN
            - VOTEKICK_IN_PROGRESS
            - KICK_TARGET_INVALID
            - VALUE_NOT_NUMERIC
            - RATE_LIMITED
            - VALIDATION_FAILED
        message: { type: string }

    # --------------------------------------------------------- Join / Room

    JoinRequest:
      type: object
      required: [name]
      description: New join.
      properties:
        name: { $ref: "#/components/schemas/DisplayName" }

    RejoinRequest:
      type: object
      required: [sessionToken]
      description: |
        Rejoin with an existing seat token. Resolves the seat BEFORE
        any new-join prohibition; permitted during AUTHOR, GUESS,
        REVEAL, and VOTE. `name` is optional and ignored.
      properties:
        sessionToken:
          type: string
          description: The session token originally issued to this seat.
        name: { $ref: "#/components/schemas/DisplayName" }

    JoinResponse:
      type: object
      required: [roomId, roomCode, playerId, sessionToken, phase, ttlExpiresAt]
      properties:
        roomId: { type: string, format: uuid }
        roomCode:
          type: string
          pattern: "^[A-Z0-9]{4}$"
        playerId: { type: string, format: uuid }
        sessionToken:
          type: string
          description: |
            Per-seat credential for X-Session-Token. The server stores
            only its hash. Valid for rejoin within the grace period.
        isCreator: { type: boolean }
        rejoined:
          type: boolean
          default: false
        phase: { $ref: "#/components/schemas/Phase" }
        ttlExpiresAt: { type: string, format: date-time }
        snapshotUrl:
          type: string
          format: uri
          description: Present when phase is past LOBBY; a rejoining
            client should fetch it immediately.

    RoomState:
      type: object
      required: [phase, players, canStart, isCreator, ttlExpiresAt]
      properties:
        phase: { $ref: "#/components/schemas/Phase" }
        players:
          type: array
          items:
            type: object
            required: [playerId, name, isCreator, connected]
            properties:
              playerId: { type: string, format: uuid }
              name: { $ref: "#/components/schemas/DisplayName" }
              isCreator: { type: boolean }
              connected: { type: boolean }
        canStart:
          type: boolean
          description: True only for the creator with 4-8 players.
        isCreator: { type: boolean }
        ttlExpiresAt: { type: string, format: date-time }

    ReplayResponse:
      type: object
      required: [newRoomId, newRoomCode, seatClaimExpiresAt]
      properties:
        newRoomId: { type: string, format: uuid }
        newRoomCode:
          type: string
          pattern: "^[A-Z0-9]{4}$"
        seatClaimExpiresAt:
          type: string
          format: date-time
          description: |
            Players (including the creator) claim seats in the new
            room by POSTing to /rooms/{newRoomCode}/join with their
            EXISTING session token before this time. Unclaimed seats
            expire with the window.

    WsTicket:
      type: object
      required: [ticket, expiresAt]
      properties:
        ticket:
          type: string
          description: Single-use; opens exactly one WebSocket.
        expiresAt: { type: string, format: date-time }

    # ------------------------------------------------------------- Author

    PriceBand:
      type: integer
      enum: [1, 2, 3, 4]
      description: |
        1 = under $15, 2 = $15–$60 (15.00 inclusive, exclusive at 60),
        3 = $60–$200, 4 = over $200. Boundary rule: a price exactly ON
        a boundary in dollars belongs to the HIGHER band. The ONLY
        price information an author ever receives. Derived
        server-side from the immutable price snapshot.

    AuthorCardView:
      type: object
      required: [cardId, imageUrl, priceBand, deadlineAt, constraints, status]
      description: |
        Author's secret view: image + price band ONLY. No title, no
        description, no exact price, no review data.
      properties:
        cardId: { type: string, format: uuid }
        imageUrl:
          type: string
          format: uri
          description: Short-lived signed URL scoped to this player
            and the AUTHOR phase window.
        priceBand: { $ref: "#/components/schemas/PriceBand" }
        deadlineAt: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/CardStatus" }
        constraints:
          type: object
          description: Mirrored client-side for live inline validation.
          properties:
            titleMinChars: { type: integer, const: 8 }
            titleMaxChars: { type: integer, const: 60 }
            bulletMinChars: { type: integer, const: 15 }
            bulletMaxChars: { type: integer, const: 80 }
            bulletSlots: { type: integer, const: 3 }
            starRatingMin: { type: number, const: 1.0 }
            starRatingMax: { type: number, const: 5.0 }
            starRatingStep: { type: number, const: 0.5 }

    AuthorCardSubmission:
      type: object
      description: |
        Every field is individually optional to support the partial
        submission rule. Bullets are 0–3 strings, each independently
        optional — a two-bullet submission is valid and stored as a
        two-item array.
      properties:
        title:
          type:
            - string
            - "null"
          minLength: 8
          maxLength: 60
          description: null or omitted = left blank.
        bullets:
          type:
            - array
            - "null"
          maxItems: 3
          items:
            type: string
            minLength: 15
            maxLength: 80
          description: |
            0 to 3 bullet strings. Fewer than 3 is a valid partial
            submission. null/omitted = no bullets.
        starRating:
          type:
            - number
            - "null"
          minimum: 1.0
          maximum: 5.0
          multipleOf: 0.5
        reviewBucket:
          type:
            - string
            - "null"
          enum:
            - UNDER_10
            - TEN_TO_99
            - HUNDRED_TO_999
            - THOUSAND_TO_9999
            - TEN_THOUSAND_PLUS
            - null
        category:
          type:
            - string
            - "null"
          description: Slug from the ~12-category dropdown.

    AuthorCardStored:
      allOf:
        - $ref: "#/components/schemas/AuthorCardSubmission"
        - type: object
          required: [cardId, status]
          properties:
            cardId: { type: string, format: uuid }
            status: { $ref: "#/components/schemas/CardStatus" }
            submittedAt:
              type:
                - string
                - "null"
              format: date-time

    AuthorValidationError:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required: [fieldErrors]
          properties:
            fieldErrors:
              type: array
              items:
                type: object
                required: [field, rule, message]
                properties:
                  field: { type: string }
                  rule:
                    type: string
                    enum:
                      - TOO_SHORT
                      - TOO_LONG
                      - DIGITS_REJECTED
                      - NUMBER_WORD_REJECTED
                      - CURRENCY_SYMBOL_REJECTED
                      - PRICE_WORD_REJECTED
                      - PROFANITY_REJECTED
                      - BULLET_COUNT
                      - STAR_RATING_STEP
                      - CATEGORY_UNKNOWN
                  message:
                    type: string
                    description: Names the offending word for
                      word-list rules, for inline display.

    # -------------------------------------------------------------- Guess

    GuessQueue:
      type: object
      required: [cards, myPosition, progress]
      properties:
        cards:
          type: array
          description: |
            Shuffled per THIS player. SUBMITTED cards only — skipped
            cards are absent and not counted. Content access is still
            gated by the open endpoint's state machine regardless of
            which IDs a client holds.
          items:
            type: object
            required: [cardId, status]
            properties:
              cardId: { type: string, format: uuid }
              status: { $ref: "#/components/schemas/GuessStatus" }
        myPosition:
          type: object
          description: The server's authoritative queue position.
          required: [activeCardId]
          properties:
            activeCardId:
              type:
                - string
                - "null"
              format: uuid
              description: The one active card, or null.
            nextCardId:
              type:
                - string
                - "null"
              format: uuid
            allDone: { type: boolean }
        progress:
          type: object
          description: Counts only — NEVER guess values.
          required: [myLocked, myTimedOut, myTotal, allPlayersDone]
          properties:
            myLocked: { type: integer }
            myTimedOut: { type: integer }
            myTotal: { type: integer }
            allPlayersDone: { type: boolean }

    GuessCardView:
      type: object
      description: |
        Drip-redacted card, valid for both the open response and
        read-only GETs. ABSENT field = drip stage not reached;
        `null` = stage reached but the author left the field blank.
        This schema structurally cannot carry the image, original
        title, original description, or true price — those fields do
        not exist here.
      required:
        - cardId
        - status
        - openedAt
        - capAt
        - lockEligibleAt
        - multiplierNow
        - draftValueCents
        - sliderTouched
      properties:
        cardId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/GuessStatus" }
        openedAt: { type: string, format: date-time }
        capAt:
          type: string
          format: date-time
          description: openedAt + 20s hard cap; auto-lock fires then.
        lockEligibleAt:
          type: string
          format: date-time
          description: openedAt + 3s minimum dwell.
        # --- 0s drip ---
        title:
          type:
            - string
            - "null"
        category:
          type:
            - string
            - "null"
        # --- 5s drip (absent before; null = author left blank) ---
        bullets:
          type: array
          maxItems: 3
          items:
            type:
              - string
              - "null"
        # --- 10s drip ---
        starRating:
          type:
            - number
            - "null"
        reviewBucket:
          type:
            - string
            - "null"
          enum:
            - UNDER_10
            - TEN_TO_99
            - HUNDRED_TO_999
            - THOUSAND_TO_9999
            - TEN_THOUSAND_PLUS
            - null
        # --- live slider state (server-authoritative) ---
        multiplierNow:
          type: number
          minimum: 0.7
          maximum: 1.0
          description: Live M(t) for the countdown ring.
        draftValueCents:
          type:
            - integer
            - "null"
          description: |
            The server-known draft (last accepted PUT /draft value),
            or null if never drafted. This is what auto-locks at cap
            if the slider was touched.
        sliderTouched: { type: boolean }
        locked: { type: boolean }
        lockedValueCents:
          type:
            - integer
            - "null"
          description: Present only when locked=true.

    ValueInput:
      type: object
      required: [valueCents]
      properties:
        valueCents:
          type: integer
          description: |
            Numeric input. Out-of-range values are CLAMPED to
            [100, 100000]; at/above $20.00 rounded to whole dollars.
            Only non-numeric input is rejected.

    ValueEcho:
      type: object
      required: [valueCents, formattedValue, wasClamped, wasRounded]
      properties:
        valueCents: { type: integer }
        formattedValue:
          type: string
          description: e.g. "$12.34" or "$127" (rounded form above $20).
        wasClamped: { type: boolean }
        wasRounded: { type: boolean }

    LockResponse:
      allOf:
        - $ref: "#/components/schemas/ValueEcho"
        - type: object
          required: [cardId, lockedAt, cardSeconds, multiplier]
          description: |
            No points field — points exist only on the server until
            FINAL.
          properties:
            cardId: { type: string, format: uuid }
            lockedAt: { type: string, format: date-time }
            cardSeconds:
              type: number
              minimum: 0
              maximum: 20
            multiplier:
              type: number
              minimum: 0.7
              maximum: 1.0
            nextCardId:
              type:
                - string
                - "null"
              format: uuid
              description: Null when the queue is done.

    # ---------------------------------------------------------- Snapshot

    GameSnapshot:
      type: object
      description: |
        The authoritative per-player state for reconnect/rejoin
        recovery. Redaction is identical to the per-resource GETs.
        Exactly one phase block is present, matching `phase`.
      required: [roomId, roomCode, playerId, phase, seq]
      properties:
        roomId: { type: string, format: uuid }
        roomCode: { type: string }
        playerId: { type: string, format: uuid }
        phase: { $ref: "#/components/schemas/Phase" }
        seq:
          type: integer
          description: Current room event sequence (AsyncAPI); the
            client can detect staleness against its last known seq.
        lobby:
          type: object
          description: Present when phase is LOBBY.
          properties:
            players: { type: array, items: { type: object } }
        author:
          type: object
          description: Present when phase is AUTHOR.
          properties:
            card: { $ref: "#/components/schemas/AuthorCardView" }
            submitted:
              type: boolean
            progress:
              type: object
              properties:
                submitted: { type: integer }
                skipped: { type: integer }
                total: { type: integer }
        guess:
          type: object
          description: Present when phase is GUESS.
          properties:
            queue: { $ref: "#/components/schemas/GuessQueue" }
            activeCard: { $ref: "#/components/schemas/GuessCardView" }
        reveal:
          type: object
          description: Present when phase is REVEAL.
          required: [slideIndex, slideCount]
          properties:
            slideIndex: { type: integer }
            slideCount: { type: integer }
            slide: { $ref: "#/components/schemas/RevealSlide" }
        vote:
          type: object
          description: Present when phase is VOTE.
          properties:
            options: { $ref: "#/components/schemas/VoteOptions" }
            myVoteCast: { type: boolean }
            deadlineAt: { type: string, format: date-time }
        final:
          type: object
          description: Present when phase is FINAL.
          properties:
            scoreboard: { $ref: "#/components/schemas/FinalScoreboard" }

    # -------------------------------------------------------------- Reveal

    RevealSlide:
      type: object
      description: |
        Original product next to the author's card, every guess as a
        labeled dot on a shared log-scale axis. NO points on slides —
        scores appear only in the final scoreboard.
      required: [slideIndex, slideCount, autoAdvanceAt, card]
      properties:
        slideIndex: { type: integer }
        slideCount: { type: integer }
        autoAdvanceAt: { type: string, format: date-time }
        canAdvance:
          type: boolean
          description: True only for the room creator.
        card:
          type: object
          required: [cardId, authorName, authored, original, guesses]
          properties:
            cardId: { type: string, format: uuid }
            authorName: { $ref: "#/components/schemas/DisplayName" }
            authored: { $ref: "#/components/schemas/AuthorCardSubmission" }
            original:
              type: object
              description: Product secrets released HERE, for the
                first time, to everyone.
              required:
                [
                  imageUrl,
                  title,
                  description,
                  priceCents,
                  snapshotDate,
                  category,
                ]
              properties:
                imageUrl: { type: string, format: uri }
                title: { type: string }
                description: { type: string }
                priceCents: { type: integer }
                snapshotDate:
                  type: string
                  format: date
                  description: Calendar date for "snapshot price as of".
                category: { type: string }
            guesses:
              type: array
              description: |
                Labeled dots in the server's animation order (dots
                land one by one, ending on the true price).
              items:
                type: object
                required: [playerName, valueCents, lockedAt]
                properties:
                  playerName: { $ref: "#/components/schemas/DisplayName" }
                  valueCents: { type: integer }
                  lockedAt: { type: string, format: date-time }
                  cardSeconds:
                    type:
                      - number
                      - "null"
                    description: Lock time for the t-dilemma story;
                      null when auto-locked on disconnect.
                  timedOut:
                    type: boolean
                    description: True when locked by cap/disconnect
                      rather than an explicit player lock.
            axisMinCents: { type: integer, const: 100 }
            axisMaxCents: { type: integer, const: 100000 }

    # ---------------------------------------------------------- Vote/Final

    VoteOptions:
      type: object
      required: [options, deadlineAt]
      properties:
        options:
          type: array
          description: SUBMITTED cards excluding the voter's own.
          items:
            type: object
            required: [cardId, authorName, title, category]
            properties:
              cardId: { type: string, format: uuid }
              authorName: { $ref: "#/components/schemas/DisplayName" }
              title:
                type:
                  - string
                  - "null"
              category:
                type:
                  - string
                  - "null"
              starRating:
                type:
                  - number
                  - "null"
              reviewBucket:
                type:
                  - string
                  - "null"
                enum:
                  [
                    UNDER_10,
                    TEN_TO_99,
                    HUNDRED_TO_999,
                    THOUSAND_TO_9999,
                    TEN_THOUSAND_PLUS,
                    null,
                  ]
        deadlineAt:
          type: string
          format: date-time
          description: |
            Voting ends when all eligible players have voted or at
            this deadline, whichever comes first. Non-voters record
            no vote.
        myVoteCast: { type: boolean }

    FinalScoreboard:
      type: object
      required: [endedReason, rankings, winnerPlayerId]
      properties:
        endedReason:
          type: string
          enum: [COMPLETED, TOO_FEW_PLAYERS]
          description: |
            TOO_FEW_PLAYERS: a votekick dropped the room under 4;
            only the cards completed by that point are included. The
            client never infers how an interrupted game resolves.
        winnerPlayerId:
          type:
            - string
            - "null"
          format: uuid
          description: Null when endedReason is TOO_FEW_PLAYERS and
            too few cards completed to rank.
        rankings:
          type: array
          items:
            type: object
            required: [rank, playerId, name, totalPoints, breakdown]
            properties:
              rank: { type: integer, minimum: 1 }
              playerId: { type: string, format: uuid }
              name: { $ref: "#/components/schemas/DisplayName" }
              totalPoints: { type: integer }
              breakdown:
                type: object
                required: [guesserPoints, authorPoints, funniestBonus]
                properties:
                  guesserPoints:
                    type: integer
                    description: Sum over every guessed card.
                  authorPoints: { type: integer }
                  funniestBonus: { type: integer }
              perCard:
                type: array
                items:
                  type: object
                  required: [cardId, role, status]
                  properties:
                    cardId: { type: string, format: uuid }
                    role: { type: string, enum: [GUESSER, AUTHOR] }
                    status:
                      description: |
                        Per-role lifecycle, so zeros are
                        distinguishable from absence.
                      oneOf:
                        - $ref: "#/components/schemas/GuessStatus"
                        - $ref: "#/components/schemas/CardStatus"
                    points: { type: integer }
                    accuracy:
                      type:
                        - number
                        - "null"
                    lockedAt:
                      type:
                        - string
                        - "null"
                      format: date-time
                    funniestVotes:
                      type:
                        - integer
                        - "null"
                      description: Author rows only.

    # ---------------------------------------------------------- Moderation

    ReportRequest:
      type: object
      description: |
        Exactly one of reportedCardId / reportedPlayerId must be
        present, and the target must belong to the reporter's room.
      properties:
        roomCode:
          type: string
          pattern: "^[A-Z0-9]{4}$"
        reportedCardId: { type: string, format: uuid }
        reportedPlayerId: { type: string, format: uuid }
        reason:
          type: string
          enum: [OFFENSIVE_CONTENT, OFFENSIVE_NAME, AFK, OTHER]
        note: { type: string, maxLength: 500 }

    ReportAdmin:
      type: object
      required: [id, roomCode, reason, status, createdAt]
      properties:
        id: { type: integer }
        roomCode: { type: string }
        reportedCardId:
          type:
            - string
            - "null"
          format: uuid
        reportedPlayerId:
          type:
            - string
            - "null"
          format: uuid
        reporterPlayerId: { type: string, format: uuid }
        reason:
          type: string
          enum: [OFFENSIVE_CONTENT, OFFENSIVE_NAME, AFK, OTHER]
        note:
          type:
            - string
            - "null"
        status:
          type: string
          enum: [OPEN, RESOLVED, DISMISSED]
        resolutionNote:
          type:
            - string
            - "null"
        createdAt: { type: string, format: date-time }

    # --------------------------------------------------------------- Admin

    ProductAdmin:
      type: object
      description: |
        ADMIN ONLY. Contains full product secrets. Images are
        registered out of band by the ingestion pipeline; reference
        them here by storage key.
      required:
        [
          imageStorageKey,
          originalTitle,
          originalDescription,
          priceCents,
          category,
          snapshotDate,
        ]
      properties:
        id: { type: integer, readOnly: true }
        imageStorageKey:
          type: string
          description: "Format: products/{contentHash}.webp|jpg — must
            reference an already-registered image."
        originalTitle: { type: string, maxLength: 512 }
        originalDescription: { type: string, maxLength: 4096 }
        priceCents:
          type: integer
          minimum: 200
          maximum: 50000
          description: Curated pool is $2–$500 (USD only).
        currency:
          type: string
          const: USD
          description: |
            Fixed to USD. Slider range, price bands, and scoring all
            assume USD; other currencies are rejected.
        category: { type: string }
        starRating:
          type:
            - number
            - "null"
          minimum: 1.0
          maximum: 5.0
        reviewCount:
          type:
            - integer
            - "null"
          minimum: 0
        snapshotDate:
          type: string
          format: date
          description: Calendar date (date, not datetime), matching
            the reveal copy.
        priceBand:
          allOf: [{ $ref: "#/components/schemas/PriceBand" }]
          readOnly: true
          description: Derived server-side from the immutable price.
        active: { type: boolean, default: true }
